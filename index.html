<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCA Operational Control Center</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }

        /* Scrollbar Futurista */
        ::-webkit-scrollbar { width: 6px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; box-shadow: 0 0 10px #06b6d4; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
        .custom-scroll { scrollbar-width: thin; scrollbar-color: #06b6d4 #020617; }

        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.35);
        }

        .tab-btn-futuristic {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.4rem 0.85rem;
            border-radius: 0.5rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.6);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
        }

        .tab-btn-futuristic:hover {
            color: #38bdf8;
            background: rgba(14, 165, 233, 0.12);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }

        .tab-btn-futuristic.active-tab {
            color: #06b6d4;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(14, 165, 233, 0.05) 100%);
            border: 1px solid #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .tab-btn-futuristic.active-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: #06b6d4;
            box-shadow: 0 0 8px #06b6d4;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

    <!-- HEADER FUTURISTA -->
    <header class="bg-slate-900/90 border-b border-cyan-500/20 px-8 py-3.5 sticky top-0 z-50 flex flex-col md:flex-row justify-between items-center gap-4 backdrop-blur-md">
        <div class="flex items-center gap-3.5">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-cyan-600 via-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg neon-glow-cyan">
                <span class="font-orbitron font-black text-lg text-cyan-200">OCA</span>
            </div>
            <div>
                <h1 class="text-lg font-orbitron font-extrabold text-white tracking-wide flex items-center gap-2">
                    OCA <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">CONTROL CENTER</span>
                </h1>
                <p class="text-[10px] font-rajdhani font-bold tracking-widest text-cyan-400 uppercase">Operational Intelligence & Metrics System</p>
            </div>
        </div>

        <div class="flex items-center gap-5">
            <div class="hidden lg:flex items-center gap-2.5 bg-slate-950/80 border border-cyan-500/30 px-3.5 py-1.5 rounded-xl neon-glow-cyan">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                <span class="text-[10px] font-orbitron font-bold text-cyan-300 uppercase tracking-widest">Auto-Sync 15m</span>
            </div>

            <button onclick="refreshCurrentView()" class="bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-orbitron font-bold text-xs px-5 py-2.5 rounded-xl transition-all shadow-lg neon-glow-cyan active:scale-95 flex items-center gap-2">
                <span>🔄 SINCRONIZAR</span>
            </button>
        </div>
    </header>

    <!-- BARRA DE NAVEGACIÓN FUTURISTA -->
    <nav class="bg-slate-950/80 border-b border-slate-800/80 px-6 py-2.5 sticky top-[65px] z-40 backdrop-blur-md">
        <div class="max-w-[1800px] mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto py-1 custom-scroll max-w-[80%]">
                <button id="tab-c-tracker" onclick="switchTab('c-tracker')" class="tab-btn-futuristic">C-Tracker</button>
                <button id="tab-cost-fee" onclick="switchTab('cost-fee')" class="tab-btn-futuristic">Cost/Fee Relation</button>
                <button id="tab-collection" onclick="switchTab('collection')" class="tab-btn-futuristic">Collection Results</button>
                <button id="tab-productivity" onclick="switchTab('productivity')" class="tab-btn-futuristic">Productivity</button>
                <button id="tab-dish-acc" onclick="switchTab('dish-acc')" class="tab-btn-futuristic">DISH ACC OCT</button>
                <button id="tab-dish-pbk" onclick="switchTab('dish-pbk')" class="tab-btn-futuristic">DISH Fbk</button>
                <button id="tab-compliance" onclick="switchTab('compliance')" class="tab-btn-futuristic">Compliance Calls</button>
                <button id="tab-qa-summary" onclick="switchTab('qa-summary')" class="tab-btn-futuristic">QA Summary</button>
                <button id="tab-failed-calls" onclick="switchTab('failed-calls')" class="tab-btn-futuristic">Failed Calls</button>
                <button id="tab-vivit" onclick="switchTab('vivit')" class="tab-btn-futuristic">VIVIT RST</button>
                <button id="tab-dnc" onclick="switchTab('dnc')" class="tab-btn-futuristic">Do Not Calls</button>
                <button id="tab-directory" onclick="switchTab('directory')" class="tab-btn-futuristic">Directory OCA</button>
            </div>

            <!-- Dropdown PK Agents -->
            <div class="relative min-w-[200px]">
                <select id="pk-agents-dropdown" onchange="onPKAgentSelect(this.value)" class="w-full bg-slate-900 border border-cyan-500/40 text-cyan-300 font-rajdhani font-bold text-xs rounded-xl px-3.5 py-2 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all cursor-pointer">
                    <option value="">⚡ PK AGENTS MODULE</option>
                </select>
            </div>

        </div>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div id="loading" class="hidden flex flex-col justify-center items-center py-20 gap-3">
            <div class="w-10 h-10 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
            <span class="text-xs font-orbitron font-bold text-cyan-400 tracking-widest uppercase">Cargando datos...</span>
        </div>

        <div id="sheet-view-container" class="max-w-[1800px] mx-auto space-y-6"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
